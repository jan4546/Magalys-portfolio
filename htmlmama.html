<!DOCTYPE html>
<html lang="en">
<head>

    <title>Magalys Nuñez</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

            </div>

            <div class="photo">
                <img src="images/nail9.jpg" alt="">
            </div>

            <div class="photo">
                <img src="images/nail10.jpg" alt="">
            </div>

            <div class="photo">
                <img src="images/nail11.jpg" alt="">
            </div>

            <div class="photo">
                <img src="images/nail12.jpg" alt="">
            </div>

        </div>

    </section>

    <!-- INSTAGRAM -->

    <section class="instagram-section">

        <a href="https://instagram.com/TUUSUARIO"
           target="_blank"
           class="instagram-button">

            <!-- Replace with your png -->

            <img src="images/instagram.png" alt="Instagram">

            <span>Instagram</span>

        </a>

    </section>

    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Magalys Nuñez
        </p>

    </footer>

    <script src="script.js"></script>
